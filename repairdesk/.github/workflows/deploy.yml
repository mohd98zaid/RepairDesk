name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f infra/docker/Dockerfile.api --target production -t repairdesk-api:latest apps/api

      - name: Build Web Docker image
        run: docker build -f infra/docker/Dockerfile.web --target production -t repairdesk-web:latest apps/web

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/repairdesk
            git pull origin main
            docker compose -f infra/compose/docker-compose.yml build
            docker compose -f infra/compose/docker-compose.yml up -d
            docker compose -f infra/compose/docker-compose.yml exec -T api alembic upgrade head
            docker image prune -f
            echo "Deploy complete at $(date)"

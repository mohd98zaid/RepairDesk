name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repairdesk_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/repairdesk_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test_access
          MINIO_SECRET_KEY: test_secret
          MINIO_BUCKET: repairdesk-test
          MINIO_USE_SSL: "false"
        run: |
          cd apps/api
          pytest tests/ -v --cov=app --cov-report=xml

      - uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml

  test-web:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Lint
        run: cd apps/web && npm run lint

      - name: Tests
        run: cd apps/web && npm run test

      - name: Type check
        run: cd apps/web && npx tsc --noEmit

  build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t repairdesk-api:ci apps/api
      - name: Build Web image
        run: docker build -f infra/docker/Dockerfile.web -t repairdesk-web:ci apps/web
